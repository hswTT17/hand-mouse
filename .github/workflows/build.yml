name: build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --windowed --name HandMouse --collect-data mediapipe hand_mouse.py
          Compress-Archive -Force dist\HandMouse HandMouse-windows.zip

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller hand_mouse.spec --noconfirm --clean
          ditto -c -k --keepParent dist/HandMouse.app HandMouse-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HandMouse-${{ runner.os }}
          path: HandMouse-*.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: HandMouse-*.zip
